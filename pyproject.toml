[project]
name = "arc"
version = "0.1.0"
description = "Controle dos ar-condicionados Haier (hOn) pela CLI e pela Siri"
readme = "README.md"
authors = [
    { name = "Lucas Porto" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
arc = "arc.cli:app"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
