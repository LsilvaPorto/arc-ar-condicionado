<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f2ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16181b" media="(prefers-color-scheme: dark)">
  <meta name="darkreader-lock">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Ar">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/icon-180.png">
  <link rel="stylesheet" href="/static/app.css">
  <title>Ar de Casa</title>
</head>
<body>
  <main class="login">
    <img src="/static/icon.svg" alt="" width="72" height="72">
    <h1>Ar de Casa</h1>
    <form id="form" novalidate>
      <label>Usuário
        <input name="usuario" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
      </label>
      <label>Senha
        <input name="senha" type="password" autocomplete="current-password" required>
      </label>
      <p id="erro" class="note warn" role="alert" hidden></p>
      <button class="main-action" type="submit">Entrar</button>
    </form>
  </main>
  <script>
    const form = document.getElementById("form");
    const erro = document.getElementById("erro");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const button = form.querySelector("button");
      button.disabled = true;
      erro.hidden = true;
      try {
        const res = await fetch("/api/entrar", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ usuario: form.usuario.value, senha: form.senha.value }),
        });
        if (res.ok) return location.replace("/");
        erro.textContent = (await res.json().catch(() => ({}))).detail || "Não foi possível entrar";
      } catch {
        erro.textContent = "Sem conexão com o servidor";
      }
      erro.hidden = false;
      button.disabled = false;
    });
  </script>
</body>
</html>
